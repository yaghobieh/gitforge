<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B"/>
      <stop offset="100%" style="stop-color:#EE5A5A"/>
    </linearGradient>
    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE5E5"/>
      <stop offset="100%" style="stop-color:#FFD4D4"/>
    </linearGradient>
    <linearGradient id="gitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F05032"/>
      <stop offset="100%" style="stop-color:#DE3C18"/>
    </linearGradient>
  </defs>
  
  <!-- Shadow -->
  <ellipse cx="64" cy="120" rx="35" ry="8" fill="#00000020"/>
  
  <!-- Body -->
  <ellipse cx="64" cy="70" rx="42" ry="45" fill="url(#bodyGrad)"/>
  
  <!-- Belly -->
  <ellipse cx="64" cy="78" rx="28" ry="30" fill="url(#bellyGrad)"/>
  
  <!-- Left Ear -->
  <path d="M25 35 Q20 10 35 20 Q45 28 40 40 Z" fill="url(#bodyGrad)"/>
  <path d="M30 30 Q28 18 38 24" fill="#FFB3B3" stroke="none"/>
  
  <!-- Right Ear -->
  <path d="M103 35 Q108 10 93 20 Q83 28 88 40 Z" fill="url(#bodyGrad)"/>
  <path d="M98 30 Q100 18 90 24" fill="#FFB3B3" stroke="none"/>
  
  <!-- Left Eye -->
  <ellipse cx="48" cy="55" rx="12" ry="14" fill="white"/>
  <ellipse cx="50" cy="56" rx="7" ry="9" fill="#2D2D2D"/>
  <ellipse cx="52" cy="53" rx="3" ry="4" fill="white"/>
  
  <!-- Right Eye -->
  <ellipse cx="80" cy="55" rx="12" ry="14" fill="white"/>
  <ellipse cx="82" cy="56" rx="7" ry="9" fill="#2D2D2D"/>
  <ellipse cx="84" cy="53" rx="3" ry="4" fill="white"/>
  
  <!-- Blush -->
  <ellipse cx="35" cy="70" rx="8" ry="5" fill="#FF9999" opacity="0.6"/>
  <ellipse cx="93" cy="70" rx="8" ry="5" fill="#FF9999" opacity="0.6"/>
  
  <!-- Mouth (happy) -->
  <path d="M55 80 Q64 90 73 80" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Left Arm holding Git logo -->
  <path d="M22 75 Q8 70 15 55 L25 60 Q20 70 25 75 Z" fill="url(#bodyGrad)"/>
  
  <!-- Git Logo in left hand -->
  <g transform="translate(5, 38) scale(0.35)">
    <path d="M92.71 44.408L52.591 4.291c-2.31-2.311-6.057-2.311-8.369 0l-8.33 8.332L46.459 23.19c2.456-.83 5.272-.273 7.229 1.685 1.969 1.97 2.521 4.81 1.67 7.275l10.186 10.185c2.465-.85 5.307-.3 7.275 1.671 2.75 2.75 2.75 7.206 0 9.958-2.752 2.751-7.208 2.751-9.961 0-2.068-2.07-2.58-5.11-1.531-7.658l-9.5-9.499v24.997c.67.332 1.303.774 1.861 1.332 2.75 2.75 2.75 7.206 0 9.959-2.75 2.749-7.209 2.749-9.957 0-2.75-2.754-2.75-7.21 0-9.959.68-.679 1.467-1.193 2.307-1.537V36.369c-.84-.344-1.625-.853-2.307-1.537-2.083-2.082-2.584-5.14-1.516-7.698L31.798 16.715 4.288 44.222c-2.311 2.313-2.311 6.06 0 8.371l40.121 40.118c2.31 2.311 6.056 2.311 8.369 0L92.71 52.779c2.311-2.311 2.311-6.06 0-8.371z" fill="url(#gitGrad)"/>
  </g>
  
  <!-- Right Arm -->
  <path d="M106 75 Q120 70 113 55 L103 60 Q108 70 103 75 Z" fill="url(#bodyGrad)"/>
  
  <!-- Branches/merge symbols floating on right -->
  <g transform="translate(100, 42)">
    <!-- Branch icon -->
    <circle cx="8" cy="5" r="4" fill="#3FB950"/>
    <circle cx="8" cy="20" r="4" fill="#58A6FF"/>
    <circle cx="20" cy="12" r="4" fill="#A371F7"/>
    <line x1="8" y1="9" x2="8" y2="16" stroke="#6E7681" stroke-width="2"/>
    <line x1="11" y1="7" x2="17" y2="10" stroke="#6E7681" stroke-width="2"/>
  </g>
  
  <!-- Feet -->
  <ellipse cx="48" cy="112" rx="14" ry="8" fill="url(#bodyGrad)"/>
  <ellipse cx="80" cy="112" rx="14" ry="8" fill="url(#bodyGrad)"/>
  
  <!-- Tail with merge symbol -->
  <path d="M106 95 Q125 90 118 75" stroke="url(#bodyGrad)" stroke-width="10" fill="none" stroke-linecap="round"/>
  <circle cx="118" cy="75" r="5" fill="#F05032"/>
</svg>
